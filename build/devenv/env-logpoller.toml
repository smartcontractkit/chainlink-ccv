# Overlay that sets log_poller_source_reader_chains = ["*"] on every committee verifier, so each reads all
# its EVM source chains through the LogPoller reader instead of the RPC reader. List chain IDs instead of
# "*" to turn it on for only those chains. The EVM secrets point [db] at evm_db, a separate database on the
# verifier's DB server. The token verifier is not listed: it has no LogPoller.
#
# standard.logpoller.profile runs it with normal block production. standard.logpoller.src-auto-mine.profile adds
# env-src-auto-mine.toml for TestE2EReorg, which mines, snapshots and reverts the source chain itself.
#
# The whole verifier array is restated below because an overlay replaces an array of tables rather
# than merging into it. A verifier added to env.toml must be added here too or it disappears from
# this profile.

[[verifier]]
  image = "verifier:latest"
  container_name = "default-verifier-1"
  nop_alias = "default-verifier-1"
  port = 8100
  # path is relative from "devenv" dir
  source_code_path = "../verifier"
  root_path = "../../"
  committee_name = "default"
  node_index = 0
  [verifier.db]
    image = "postgres:16-alpine"
    name = "default-verifier-1-db"
    port = 8432
  [verifier.opaque_configs.evm]
    log_poller_source_reader_chains = ["*"]

