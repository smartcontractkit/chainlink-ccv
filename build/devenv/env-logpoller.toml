# Overlay for the LogPoller profile. It does not turn the LogPoller on yet: that is log_poller_enabled
# in each committee verifier's EVM config, with [db] in its EVM secrets, and devenv writes neither.
#
# Use it with env-src-auto-mine.toml (see standard.logpoller.profile): the finality-violation and
# reorg flows for the ccv blocks commands need manual control of source-chain block progress.
#
# The whole verifier array is restated below because an overlay replaces an array of tables rather
# than merging into it. A verifier added to env.toml must be added here too or it disappears from
# this profile.

[[verifier]]
  image = "verifier:latest"
  container_name = "default-verifier-1"
  nop_alias = "default-verifier-1"
  port = 8100
  # path is relative from "devenv" dir
  source_code_path = "../verifier"
  root_path = "../../"
  committee_name = "default"
  node_index = 0
  [verifier.db]
    image = "postgres:16-alpine"
    name = "default-verifier-1-db"
    port = 8432

