## Default Verifier Setup

[[token_verifier]]
  mode = "standalone"
  image = "token-verifier:latest"
  container_name = "token-verifier-1"
  port = 8700
  source_code_path = "../verifier"
  root_path = "../../"
  [token_verifier.db]
    image = "postgres:16-alpine"
    name = "token-verifier-1-db"
    port = 8450

[[indexer]]
  image = "indexer:latest"
  port = 8104
  # will spawn additional indexers IF high_availability is set to true
  redundant_indexers = 1
  source_code_path = "../indexer"
  root_path = "../../"
  storage_connection_url = "postgresql://indexer:indexer@indexer-db:5432/indexer?sslmode=disable"
  [indexer.db]
    image = "postgres:16-alpine"
  # Optional: full DB connection string (container-to-container). When set, used for storage config and output.

[indexer.indexer_config]
LogLevel = 'debug'

[indexer.indexer_config.Monitoring]
