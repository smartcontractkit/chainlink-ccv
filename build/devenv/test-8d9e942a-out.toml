# Sui blockchain network faucet port
faucet_port = ''
# Number of Canton network validators
number_of_canton_validators = 0
# GAPv2 specific parameter: host netowork mode, if 'true' will run environment in host network mode
host_network_mode = false
# GAPv2 specific parameter: path to default Ubuntu's certificates
certificates_path = ''

# blockchain deployment output
[blockchains.out]
# Whether to respect caching or not, if cache = true component won't be deployed again
use_cache = true
# Type can be one of: anvil geth besu solana aptos tron sui ton canton stellar, this struct describes common configuration we are using across all blockchains
type = 'anvil'
# Blockchain family, can be one of: evm solana aptos sui tron ton canton stellar
family = 'evm'
# Blockchain Docker container name
container_name = 'blockchain-3rd'
# Chain ID
chain_id = '3337'

# Blockchain nodes info
[[blockchains.out.nodes]]
# External blockchain node WebSocket URL
ws_url = 'ws://127.0.0.1:8565'
# External blockchain node HTTP URL
http_url = 'http://127.0.0.1:8565'
# Internal blockchain node WebSocket URL
internal_ws_url = 'ws://blockchain-3rd:8565'
# Internal blockchain node HTTP URL
internal_http_url = 'http://blockchain-3rd:8565'

[protocol_contracts]
[aggregator_endpoints]
default = 'localhost:50051'
secondary = 'localhost:50052'
tertiary = 'localhost:50053'

[aggregator_ca_cert_files]
default = '/Users/bala/Library/Preferences/ccv/tls-shared/ca.crt'
secondary = '/Users/bala/Library/Preferences/ccv/tls-shared/ca.crt'
tertiary = '/Users/bala/Library/Preferences/ccv/tls-shared/ca.crt'

[environment_topology]
indexer_address = ['http://indexer-1:8100']
pyroscope_url = ''

[environment_topology.monitoring]
LogLevel = 'debug'

[environment_topology.monitoring.Pyroscope]
Enabled = true
URL = 'http://host.docker.internal:4040'

[environment_topology.monitoring.Beholder]
Enabled = true
InsecureConnection = true
CACertFile = ''
OtelExporterGRPCEndpoint = ''
OtelExporterHTTPEndpoint = 'host.docker.internal:4318'
ChipIngressEndpoint = ''
ChipIngressInsecureConnection = false
LogStreamingEnabled = true
LogStreamingLevel = ''
MetricReaderInterval = 5
TraceSampleRatio = 1.0
TraceBatchTimeout = 10

[environment_topology.monitoring.Beholder.TelemetryAttributes]
ccip_env = 'devenv'

