name: 'AWS ECR Authentication'
description: 'Configure AWS credentials and authenticate to ECR Public'
inputs:
  role-to-assume:
    description: 'IAM role to assume'
    required: true
  # Fail-closed by default: an empty role fails the job unless the caller explicitly
  # opts in; only secretless Dependabot/fork PR runs are allowed to skip.
  skip-when-missing-role:
    description: 'Skip authentication when role-to-assume is empty (secretless Dependabot/fork PR runs only).'
    required: false
    default: 'false'
  aws-region:
    description: 'AWS region'
    required: true
    default: 'us-west-2'
  registry-type:
    description: 'ECR registry type'
    required: false
    default: 'private'
  registries:
    description: 'ECR registry to login'
    required: false

runs:
  using: "composite"
  steps:
    - name: Validate role input
      id: validate
      shell: bash
      env:
        ROLE_TO_ASSUME: ${{ inputs.role-to-assume }}
        SKIP_WHEN_MISSING: ${{ inputs.skip-when-missing-role }}
      run: |
        if [[ -n "$ROLE_TO_ASSUME" ]]; then
          echo "auth=true" >> "$GITHUB_OUTPUT"
        elif [[ "$SKIP_WHEN_MISSING" == "true" ]]; then
          echo "auth=false" >> "$GITHUB_OUTPUT"
          echo "role-to-assume empty with skip-when-missing-role=true; skipping ECR authentication."
        else
          echo "::error::role-to-assume is empty (missing or renamed secret?); failing closed. Pass skip-when-missing-role=true only for secretless Dependabot/fork PR runs."
          exit 1
        fi

    - name: Configure AWS credentials using OIDC
      if: steps.validate.outputs.auth == 'true'
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
    - name: Authenticate to ECR
      id: login-ecr
      if: steps.validate.outputs.auth == 'true'
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      with:
        registry-type: ${{ inputs.registry-type }}
        registries: ${{ inputs.registries }}
