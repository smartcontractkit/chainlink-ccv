name: 'Build CL Node Image'
description: 'Build Chainlink node image with plugins'

runs:
  using: "composite"
  steps:
    - name: Checkout Chainlink repository
      uses: actions/checkout@v5
      with:
        repository: smartcontractkit/chainlink
        ref: f5514c42f578aba6b242dae752b91e4d9a7e2e33
        path: chainlink-repo

    - name: Setup path to go.mod
      id: go-mod
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        echo "path=${WORKSPACE}/chainlink-repo/go.mod" | tee -a "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v6 # v6
      with:
        go-version-file: ${{ steps.go-mod.outputs.path }}
        cache: true

    - name: Download Go modules
      working-directory: ${{ github.workspace }}/chainlink-repo
      shell: bash
      run: go mod download
    
    - name: Upgrade chainlink-ccv dependency to current commit
      working-directory: ${{ github.workspace }}/chainlink-repo
      shell: bash
      env:
        # chainlink-ccv's go.mod may require a newer Go than chainlink-repo's own go.mod pins.
        # actions/setup-go sets GOTOOLCHAIN=local by default; allow auto-download so `go get`/`make
        # gomodtidy` can transparently fetch a newer toolchain instead of hard-failing.
        GOTOOLCHAIN: auto
      run: |
        # For merge queue runs, prefer the queue ref name over synthetic SHA.
        # Synthetic SHAs may be checkout-able by Actions but not always resolvable as module versions.
        TARGET_REF="${{ github.event.pull_request.head.sha || github.ref_name }}"
        echo "Upgrading github.com/smartcontractkit/chainlink-ccv using ref: ${TARGET_REF}"

        # Bypass module proxy for this lookup to avoid stale/negative cache behavior on ephemeral refs.
        success=0
        for i in {1..5}; do
          if GOPRIVATE=github.com/smartcontractkit/chainlink-ccv go get github.com/smartcontractkit/chainlink-ccv@"${TARGET_REF}"; then
            success=1
            break
          fi
          echo "go get failed (attempt $i/5), retrying in 10s..."
          sleep 10
        done
        if [ "$success" -ne 1 ]; then
          echo "go get failed after 5 attempts"
          exit 1
        fi
        # The upgraded ref is a transient pseudo-version from the current PR head.
        # Avoid checksum DB lookups for this module during multi-module tidy runs.
        GONOSUMDB=github.com/smartcontractkit/chainlink-ccv make gomodtidy

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

    - name: Build and Load Docker Image
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        cache-from: type=gha,timeout=10m,scope=ccv-${{ runner.os }}-${{ runner.arch }}
        cache-to: type=gha,timeout=10m,mode=max,ignore-error=true,scope=ccv-${{ runner.os }}-${{ runner.arch }}
        context: ${{ github.workspace }}/chainlink-repo
        file: ${{ github.workspace }}/chainlink-repo/plugins/chainlink.Dockerfile
        load: true
        tags: local
