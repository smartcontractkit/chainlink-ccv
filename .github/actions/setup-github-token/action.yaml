name: Setup GitHub Token
description: >-
  Calls smartcontractkit/.github's GATI token setup, or skips it when this is a
  Dependabot/fork PR run with no repo secrets (all module dependencies here are
  public). Any partial configuration, or missing secrets on a trusted run
  (push, human PR, merge queue), fails closed so auth cannot silently degrade.

inputs:
  aws-role-arn:
    description: ARN of role capable of getting token from GATI
    required: false
    default: ''
  aws-lambda-url:
    description: URL of GATI lambda function
    required: false
    default: ''
  aws-region:
    description: AWS region
    required: false
    default: ''
  aws-role-duration-seconds:
    description: Duration of role in seconds
    required: false
    default: '900'
  role-session-name:
    description: Session name to use when assuming the role.
    required: false
    default: '${{ github.run_id }}-${{ github.run_number }}-${{ github.job }}'
  set-git-config:
    description: Set git config
    required: false
    default: 'false'

outputs:
  access-token:
    description: The github access token that has permissions reflecting the current AWS role value
    value: ${{ steps.gati.outputs.access-token }}

runs:
  using: composite
  steps:
    - name: Validate GATI inputs
      id: validate
      shell: bash
      env:
        AWS_ROLE_ARN: ${{ inputs.aws-role-arn }}
        AWS_LAMBDA_URL: ${{ inputs.aws-lambda-url }}
        AWS_REGION: ${{ inputs.aws-region }}
        # Dependabot and fork PR runs get no repo secrets; every other run is trusted.
        SECRETLESS_RUN: ${{ github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.fork == true) }}
      run: |
        present=0
        if [[ -n "$AWS_ROLE_ARN" ]]; then present=$((present + 1)); fi
        if [[ -n "$AWS_LAMBDA_URL" ]]; then present=$((present + 1)); fi
        if [[ -n "$AWS_REGION" ]]; then present=$((present + 1)); fi
        if [[ "$present" -eq 3 ]]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        elif [[ "$present" -eq 0 && "$SECRETLESS_RUN" == "true" ]]; then
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Dependabot/fork PR without repo secrets; skipping GATI token setup."
        else
          echo "::error::GATI inputs incomplete (${present}/3 set); failing closed so auth cannot silently degrade."
          exit 1
        fi

    - name: Setup GitHub Token
      id: gati
      if: steps.validate.outputs.run == 'true'
      uses: smartcontractkit/.github/actions/setup-github-token@ef78fa97bf3c77de6563db1175422703e9e6674f # setup-github-token@0.2.1
      with:
        aws-role-arn: ${{ inputs.aws-role-arn }}
        aws-lambda-url: ${{ inputs.aws-lambda-url }}
        aws-region: ${{ inputs.aws-region }}
        aws-role-duration-seconds: ${{ inputs.aws-role-duration-seconds }}
        role-session-name: ${{ inputs.role-session-name }}
        set-git-config: ${{ inputs.set-git-config }}
