# CCV-specific dependency-review policy.
#
# Baseline copied from smartcontractkit/.github/actions/dependency-review/configs/
# license-deny-vulnerability-high.yml. Review this denylist periodically with Legal.
# Exceptions are immutable package URLs approved for this repository only.
allow_dependencies_licenses:
  # LGPL-3.0 library usage approved by Legal; the bundled cmd/ code is GPL-3.0.
  - pkg:golang/github.com/ethereum/go-ethereum@v1.17.3
  # MPL-2.0 dependencies approved by Legal for CCV's current usage.
  - pkg:golang/github.com/hashicorp/go-bexpr@v0.1.10
  - pkg:golang/github.com/hashicorp/go-plugin@v1.8.0
  - pkg:golang/github.com/hashicorp/golang-lru/v2@v2.0.7
  - pkg:golang/github.com/hashicorp/yamux@v0.1.2
  - pkg:golang/github.com/smartcontractkit/freeport@v0.1.3-0.20250828155247-add56fa28aad

# Fails when a dependency introduced by a pull request uses a denied license or has a
# high-or-greater vulnerability.
vulnerability_check: true
fail_on_severity: "high"
license_check: true
deny_licenses:
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0-only
