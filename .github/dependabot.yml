version: 2
updates:
  # Alerts only: dependabump opens the fix PRs because it tidies every module.
  - package-ecosystem: gomod
    directories:
      - /
      - /deployment
      - /integration/evm
      - /build/devenv
      - /build/devenv/fakes
      - /indexer/cmd/oapigen
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  # Alerts only: Renovate opens the fix PRs (see .github/workflows/renovate.yaml),
  # because PRs Dependabot authors never get CI in this repo.
  - package-ecosystem: docker
    directories:
      - /aggregator
      - /executor
      - /indexer
      - /pricer
      - /verifier
      - /build/devenv/fakes
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
