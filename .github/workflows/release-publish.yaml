name: Publish GA Image From Release Tag

# Publishes GA (non-RC) service images when release-please cuts a root release.
# The bare root tag `vX.Y.Z` is produced by release-please under the GATI GitHub App
# token, which triggers this workflow. In GitHub Actions
# tag globs `*` does not match `/`, so `v[0-9]+.[0-9]+.[0-9]+` matches only the bare
# root tag — never module tags (`deployment/vX.Y.Z`) or RC tags (`<svc>/vX.Y.Z-rc`).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [verifier, aggregator, indexer, executor]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
        with:
          just-version: '1.40.0'

      - name: Authenticate to AWS ECR (primary)
        uses: ./.github/actions/aws-ecr-auth
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE_PRIMARY }}
          aws-region: us-west-2
          registry-type: private

      - name: Authenticate to AWS ECR (secondary)
        uses: ./.github/actions/aws-ecr-auth
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE_SECONDARY }}
          aws-region: us-east-2
          registry-type: private

      - name: Build & Publish GA Image
        env:
          MODULE: ${{ matrix.module }}
          VERSION: ${{ github.ref_name }}
          ECR_REGISTRY_PRIMARY: ${{ secrets.ECR_REGISTRY_PRIMARY }}
          ECR_REGISTRY_SECONDARY: ${{ secrets.ECR_REGISTRY_SECONDARY }}
        run: |
          echo "Module: $MODULE"
          echo "Version: $VERSION"
          echo "Building GA Image.."
          just "$MODULE"/build
          echo "Publishing GA Image (primary).."
          just "$MODULE"/publish "$ECR_REGISTRY_PRIMARY" "$VERSION"
          echo "Publishing GA Image (secondary).."
          just "$MODULE"/publish "$ECR_REGISTRY_SECONDARY" "$VERSION"
  
  build-marketplace-gcp:
    name: Push ${{ matrix.module }} to GCP Marketplace AR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Note on the image names and divergence from AWS ECR:
          # Google Cloud Marketplace requires the image name to be the same as the product name in the GCP Marketplace listing.
          # The aggregator was arbitrarily chosen to match the product name, and all complementary images are pushed under the
          # same "namespace", in this case "ccv-cell".
          - { module: committee verifier, dockerfile: verifier/Dockerfile, build_args: '--build-arg VERIFIER_TYPE=committee', image: ccv-cell/verifier }
          - { module: aggregator, dockerfile: aggregator/Dockerfile, build_args: '', image: ccv-cell }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - uses: docker/setup-buildx-action@v3
      - run: gcloud auth configure-docker us-docker.pkg.dev --quiet
      - run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f ${{ matrix.dockerfile }} ${{ matrix.build_args }} \
            --annotation "index:com.googleapis.cloudmarketplace.product.service.name=services/chainlink-ccv-starter-kit.endpoints.chainlink-labs-ltd-public.cloud.goog" \
            -t us-docker.pkg.dev/chainlink-labs-ltd-public/google-marketplace-chainlink-ccv/${{ matrix.image }}:${{ github.ref_name }} \
            --push .

  build-public:
    name: Build, sign & publish public ${{ matrix.module }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: committee verifier
            repository: chainlink-ccv-verifier
            dockerfile: verifier/Dockerfile
            build_args: VERIFIER_TYPE=committee
          - module: aggregator
            repository: chainlink-ccv-aggregator
            dockerfile: aggregator/Dockerfile
            build_args: ''
    permissions:
      contents: read
      id-token: write
    uses: smartcontractkit/.github/.github/workflows/reusable-docker-build-publish.yml@f4ff50d0f4713ed7b247dbd8a58316484907f958 # 2026-01-13
    with:
      aws-ecr-name: ${{ matrix.repository }}
      aws-region-ecr: us-east-1
      build-arm64-image: 'true'
      dockerfile: ${{ matrix.dockerfile }}
      docker-build-context: .
      docker-build-args: ${{ matrix.build_args }}
      docker-manifest-sign: 'true'
      docker-registry-url-override: public.ecr.aws/chainlink
      git-sha: ${{ github.sha }}
      github-event-name: ${{ github.event_name }}
      github-ref-name: ${{ github.ref_name }}
      github-ref-type: ${{ github.ref_type }}
      github-workflow-repository: ${{ github.repository }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_SDLC }}
      AWS_ROLE_PUBLISH_ARN: ${{ secrets.CCV_IAM_ROLE_SDLC }}
