name: Repo Hygiene Checks

on:
  merge_group:
  pull_request:
    # labeled/unlabeled re-run the metrics check when metrics-breaking-change changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

jobs:
  hygiene-checks:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Setup GitHub Token
        id: setup-github-token
        uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
        with:
          aws-role-arn: ${{ secrets.GATI_AWS_ROLE_ARN_CHAINLINK_READ_ONLY }}
          aws-lambda-url: ${{ secrets.GATI_LAMBDA_URL_RELENG }}
          aws-region: ${{ secrets.GATI_AWS_REGION }}
          set-git-config: true

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6 # v6
        env:
          GOPRIVATE: github.com/smartcontractkit/*
        with:
          cache: true
          go-version-file: 'go.mod'

      - name: Install just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
        with:
          just-version: '1.40.0'

      - name: Install go-tools
        run: just install-go-tools

      # Check that go.mod files have fully specificed Go versions that match tool-versions.env
      - name: Enforce go.mod Go versions
        run: tools/bin/check-go-versions.sh

      - name: Run repo hygiene checks
        run: tools/bin/check_repo_clean.sh tidy mock generate shellcheck

      - name: Check metrics golden files are up to date
        run: just metrics-golden-verify

      # Fails if a PR removes or changes a metric or label. The metrics-breaking-change label allows it.
      - name: Check metrics are add-only
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'metrics-breaking-change') }}
        run: just metrics-golden-check "${BASE_SHA}" "${ALLOW_BREAKING}"
