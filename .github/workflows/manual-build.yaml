name: Manual build from

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "The git ref to check out"
        required: true

jobs:
  build-pub:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [verifier, aggregator, indexer, executor]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git-ref }}

      - name: Install Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
        with:
          just-version: '1.40.0'

      - name: Authenticate to AWS ECR
        uses: ./.github/actions/aws-ecr-auth
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE }}
          aws-region: us-west-2
          registry-type: private

      - name: Build & Publish Release Candidate
        env:
          MODULE: ${{ matrix.module }}
          COMMIT_SHA: ${{ inputs.git-ref }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          TAG="manual-$COMMIT_SHA"

          echo "Module: $MODULE"
          echo "Git Ref: $COMMIT_SHA"
          echo "Full Tag: $TAG"
          echo "Building latest main image.."
          just "$MODULE"/build-rc
          echo "Publishing image.."
          just "$MODULE"/publish-rc "$ECR_REGISTRY" "$TAG"

  # Builds the ZK verifier image from cmd/verifier/zk and publishes it into the token verifier repository under a
  # zk-poc- tag. Run this workflow from the zk-verifier-poc branch, with that branch as the git ref.
  build-zk:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git-ref }}

      - name: Install Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
        with:
          just-version: '1.40.0'

      # The deployments pull from the regional registries, so publish with the same roles and registries as the
      # main branch publish workflow.
      - name: Authenticate to AWS ECR (primary)
        uses: ./.github/actions/aws-ecr-auth
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE_PRIMARY }}
          aws-region: us-west-2
          registry-type: private

      - name: Authenticate to AWS ECR (secondary)
        uses: ./.github/actions/aws-ecr-auth
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE_SECONDARY }}
          aws-region: us-east-2
          registry-type: private

      - name: Build & Publish ZK verifier
        env:
          COMMIT_SHA: ${{ inputs.git-ref }}
          ECR_REGISTRY_PRIMARY: ${{ secrets.ECR_REGISTRY_PRIMARY }}
          ECR_REGISTRY_SECONDARY: ${{ secrets.ECR_REGISTRY_SECONDARY }}
        run: |
          echo "Git Ref: $COMMIT_SHA"
          echo "Full Tag: zk-poc-$COMMIT_SHA"
          echo "Building ZK verifier image.."
          just verifier/build-zk
          echo "Publishing image (primary).."
          just verifier/publish-zk "$ECR_REGISTRY_PRIMARY" "$COMMIT_SHA"
          echo "Publishing image (secondary).."
          just verifier/publish-zk "$ECR_REGISTRY_SECONDARY" "$COMMIT_SHA"
