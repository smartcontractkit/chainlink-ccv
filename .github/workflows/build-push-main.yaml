name: Publish Main commit

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to build. Leave empty to use the head of the selected ref.'
        required: false
        type: string

concurrency:
  group: publish-main-${{ github.ref }}-${{ inputs.commit_sha || 'head' }}
  cancel-in-progress: true

jobs:
  build-pub:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [verifier, aggregator, indexer, executor]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Resolve commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
        with:
          just-version: '1.40.0'

      - name: Authenticate to AWS ECR (primary)
        uses: ./.github/actions/aws-ecr-auth
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE_PRIMARY }}
          aws-region: us-west-2
          registry-type: private

      - name: Authenticate to AWS ECR (secondary)
        uses: ./.github/actions/aws-ecr-auth
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE_SECONDARY }}
          aws-region: us-east-2
          registry-type: private

      - name: Build & Publish Release Candidate
        env:
          MODULE: ${{ matrix.module }}
          COMMIT_SHA: ${{ steps.sha.outputs.sha }}
          ECR_REGISTRY_PRIMARY: ${{ secrets.ECR_REGISTRY_PRIMARY }}
          ECR_REGISTRY_SECONDARY: ${{ secrets.ECR_REGISTRY_SECONDARY }}
        run: |
          TAG="$COMMIT_SHA"

          echo "Module: $MODULE"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Full Tag: $TAG"
          echo "Building latest main image.."
          just "$MODULE"/build-rc
          echo "Publishing image (primary).."
          just "$MODULE"/publish-rc "$ECR_REGISTRY_PRIMARY" "$TAG"
          echo "Publishing image (secondary).."
          just "$MODULE"/publish-rc "$ECR_REGISTRY_SECONDARY" "$TAG"
