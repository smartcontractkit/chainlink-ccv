---
# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json

version: "2"

# https://golangci-lint.run/usage/configuration/#linters-configuration
linters:
  enable:
    # keep sorted
    - asasalint
    - copyloopvar
    - decorder
    - depguard
    - dupl
    - dupword
    - errcheck
    - fatcontext
    - forbidigo
    - goconst
    - godot
    - gosec
    - govet
    - grouper
    - importas
    - misspell
    - modernize
    - nakedret
    - nestif
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - tagalign
    - unconvert
    - unused
    # end keep sorted
  disable:
    - nonamedreturns
  settings:
    # https://golangci-lint.run/usage/linters/#copyloopvar
    copyloopvar:
      check-alias: true

    # https://golangci-lint.run/usage/linters/#decorder
    decorder:
      dec-order:
        - const
        - var
        - type
        - func
      ignore-underscore-vars: true
      disable-dec-order-check: true
      disable-init-func-first-check: true

    # https://golangci-lint.run/usage/linters/#depguard
    depguard:
      rules:
        # The protocol layer is default-deny: an import must be named here or it
        # fails. This is deliberately stricter than the other rules -- a blocklist
        # only stops dependencies we already thought of.
        # Adding an entry here should be a considered decision.
        protocol:
          list-mode: strict
          files:
            - ${config-path}/protocol/*.go
            - ${config-path}/protocol/**/*.go
          allow:
            - $gostd
            - github.com/smartcontractkit/chainlink-ccv/protocol
            - github.com/smartcontractkit/chain-selectors
            # See the evm_chain_access rationale: secp256k1 signing is protocol work.
            # common is allowed for common.Address, the 20-byte signer address shared
            # by every chain family. common/hexutil is denied by evm_hex_formatting.
            - github.com/ethereum/go-ethereum/crypto
            - github.com/ethereum/go-ethereum/common
            - github.com/google/uuid
            - github.com/stretchr/testify
            - go.uber.org/zap
            - golang.org/x/crypto
            - google.golang.org/grpc
            - google.golang.org/protobuf

        # go-ethereum/common is allowed above as an address/crypto primitive, but
        # depguard matches by prefix, so common/hexutil rides in on that allow by
        # accident. hexutil is Ethereum hex formatting, not a crypto primitive --
        # encoding/hex covers the same ground. Denied separately so the `common`
        # carve-out stays as narrow as it reads.
        evm_hex_formatting:
          list-mode: lax
          files:
            - $all
            - "!${config-path}/integration/evm/**"
            - "!${config-path}/build/devenv/**"
            - "!${config-path}/deployment/**"
            # Two call sites: hexutil.Decode in signer.go, hexutil.Encode in
            # verifier.go. Port both to encoding/hex and delete this line.
            - "!${config-path}/verifier/pkg/commit/**"
          deny:
            - pkg: github.com/ethereum/go-ethereum/common/hexutil
              desc: Ethereum hex formatting is chain-specific; use encoding/hex.
        executor_verifier:
          list-mode: lax
          files:
            - ${config-path}/executor/*.go
            - ${config-path}/executor/**/*.go
            - ${config-path}/verifier/*.go
            - ${config-path}/verifier/**/*.go
          allow:
            - $gostd
            - github.com/smartcontractkit/chainlink-ccv
            - github.com/smartcontractkit/chainlink-common/pkg/logger
            - github.com/smartcontractkit/chainlink-common/pkg/services
            - github.com/smartcontractkit/chainlink-common/pkg/metrics
            - github.com/smartcontractkit/chainlink-common/pkg/beholder
            - github.com/smartcontractkit/chainlink-common/pkg/utils/tests
            - github.com/smartcontractkit/chainlink-common/pkg/sqlutil
            - github.com/smartcontractkit/chainlink-common/keystore
          deny:
            - pkg: github.com/smartcontractkit/chainlink
              desc: No chainlink dependencies in verifier or executor packages

        # CCV EVM split (CCIP-13534/13535). The principle: crypto primitives are
        # protocol code, chain interaction is EVM code.
        #
        # go-ethereum/{crypto,common,accounts/keystore} are allowed everywhere on
        # purpose, not by oversight. CCV committee signatures are ECDSA on secp256k1
        # for every chain family -- chainlink-ccip-solana provisions an ECDSA_S256
        # key and signs through this same shared path. That dependency is protocol
        # work, not chain work.
        #
        # Everything else in go-ethereum, and all of chainlink-evm, is chain
        # interaction and belongs in an EVM-specific package.
        evm_chain_access:
          list-mode: lax
          files:
            - $all
            # EVM-specific by design.
            - "!${config-path}/integration/evm/**"
            - "!${config-path}/build/devenv/**"
            - "!${config-path}/deployment/**"
            # EVM code that has not moved to integration/evm yet. Delete each entry
            # as its package is split out (CCIP-13534); do not add new ones.
            - "!${config-path}/integration/pkg/accessors/**"
            - "!${config-path}/integration/pkg/constructors/**"
            - "!${config-path}/integration/pkg/contracttransmitter/**"
            - "!${config-path}/integration/pkg/destinationreader/**"
            - "!${config-path}/integration/pkg/rmnremotereader/**"
            - "!${config-path}/pricer/**"
            - "!${config-path}/verifier/pkg/token/lombard/**"
          allow:
            # Crypto primitives for the shared, chain-family-agnostic signing path.
            - github.com/ethereum/go-ethereum/crypto
            - github.com/ethereum/go-ethereum/common
            - github.com/ethereum/go-ethereum/accounts/keystore
          deny:
            - pkg: github.com/ethereum/go-ethereum
              desc: Chain interaction belongs in an EVM package (integration/evm). Only go-ethereum crypto/common/accounts-keystore are protocol code.
            - pkg: github.com/smartcontractkit/chainlink-evm
              desc: Chain interaction belongs in an EVM package (integration/evm), not in shared or protocol code.

        test:
          list-mode: lax
          files:
            - $test
          allow:
            - $gostd
          deny:
            - pkg: github.com/test-go
              desc: Use github.com/stretchr instead
            - pkg: github.com/test-go/testify/assert
              desc: Use github.com/stretchr/testify/assert
            - pkg: github.com/test-go/testify/require
              desc: Use github.com/stretchr/testify/require
            - pkg: github.com/smartcontractkit/chainlink/v2
              desc: System-level tests should not import chainlink/v2, please either use chain-specific packages or consult core team

        main:
          list-mode: lax
          files:
            - $all
          allow:
            - $gostd
          deny:
            - pkg: github.com/mitchellh/mapstructure
              desc: This package is not maintained; Use github.com/go-viper/mapstructure/v2 instead.
            - pkg: github.com/x/net/context
              desc: Use context package from the standard library.
            - pkg: github.com/pkg/errors
              desc: Should be replaced by the standard lib errors package.
            - pkg: github.com/rogpeppe/go-internal/semver
              desc: This package is not maintained; Use golang.org/x/mod/semver instead.
            - pkg: io/ioutil
              desc: "Replaced by io and os packages since Go 1.16: https://golang.org/doc/go1.16#io"
            - pkg: github.com/google/go-cmp/cmp
              desc: "cmp should only be used in tests, justification needed if used elsewhere"
            - pkg: "math/rand$"
              desc: "Use math/rand/v2"

    # https://golangci-lint.run/usage/linters/#errcheck
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - io/ioutil.ReadAll
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
        - fmt.Fprint(f|ln)?
        - (bytes.Buffer).WriteString

    # https://golangci-lint.run/usage/linters/#fatcontext
    fatcontext:
      check-struct-pointers: true

    # https://golangci-lint.run/usage/linters/#forbidigo
    forbidigo:
      forbid:
        # Built-in bootstrapping functions.
        - pattern: ^print(ln)?$
        # Optional message that gets included in error reports.
        - pattern: ^fmt\.Print.*$
          msg: Do not commit print statements.
        # Alternatively, put messages at the end of the regex, surrounded by `(# )?`.
        # Escape any special characters. Those messages get included in error reports.
        - pattern: 'fmt\.Print.*(# Do not commit print statements\.)?'
        # Forbid spew Dump, whether it is called as function or method.
        # Depends on analyze-types below.
        - pattern: ^spew\.(ConfigState\.)?Dump$

    # https://golangci-lint.run/usage/linters/#goconst
    goconst:
      min-len: 6
      min-occurrences: 12
      ignore-tests: true

    # https://golangci-lint.run/usage/linters/#gocritic
    gocritic:
      disabled-checks: []
      enabled-tags:
        - diagnostic
        - style
        - performance
      settings:
        elseif:
          skipBalanced: false

    # https://golangci-lint.run/usage/linters/#govet
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment

    # https://golangci-lint.run/usage/linters/#grouper
    grouper:
      import-require-single-import: false
      import-require-grouping: false

    # https://golangci-lint.run/usage/linters/#importas
    importas:
      alias:
        # Don't allow aliasing errors.
        - pkg: errors
          alias: ""
        - pkg: github.com/smartcontractkit/devenv/service/(\w+)/(v[\w\d]+)
          alias: $1$2

    # https://golangci-lint.run/usage/linters/#gosec
    gosec:
      excludes:
        - G601 # Implicit memory aliasing - Resolved in Go 1.22+

    # https://golangci-lint.run/usage/linters/#misspell
    misspell:
      locale: US
      extra-words:
        - typo: cancelation
          correction: cancellation
        - typo: validaton
          correction: validation
        - typo: marshalling
          correction: marshaling
        - typo: meatdata
          correction: metadata
      mode: restricted

    # https://golangci-lint.run/usage/linters/#revive
    revive:
      rules:
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#atomic
        - name: atomic
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#bare-return
        - name: bare-return
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#blank-imports
        - name: blank-imports
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#bool-literal-in-expr
        - name: bool-literal-in-expr
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#constant-logical-expr
        - name: constant-logical-expr
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#context-as-argument
        - name: context-as-argument
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#context-keys-type
        - name: context-keys-type
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#comment-spacings
        - name: comment-spacings
          severity: warning
          arguments:
            - "mypragma:"
            - "+optional"
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#defer
        - name: defer
          severity: warning
          arguments:
            - ["call-chain", "loop"]
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#early-return
        - name: early-return
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#enforce-map-style
        - name: enforce-map-style
          severity: error
          arguments: ["make"]
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#empty-block
        - name: empty-block
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#empty-lines
        - name: empty-lines
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#error-naming
        - name: error-naming
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#error-return
        - name: error-return
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#error-strings
        - name: error-strings
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#errorf
        - name: errorf
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#exported
        - name: exported
          severity: warning
          disabled: false
          exclude: [""]
          arguments:
            - "check-public-interface"
            - "disable-checks-on-constants"
            - "disable-checks-on-functions"
            - "disable-checks-on-methods"
            - "disable-checks-on-types"
            - "disable-checks-on-variables"
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#get-return
        - name: get-return
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#identical-branches
        - name: identical-branches
          severity: error
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#if-return
        - name: if-return
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#import-alias-naming
        - name: import-alias-naming
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#increment-decrement
        - name: increment-decrement
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#indent-error-flow
        - name: indent-error-flow
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#optimize-operands-order
        - name: optimize-operands-order
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#package-comments
        - name: package-comments
          disabled: true
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#range-val-address
        - name: range-val-address
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#range-val-in-closure
        - name: range-val-in-closure
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#range
        - name: range
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#receiver-naming
        - name: receiver-naming
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#redefines-builtin-id
        - name: redefines-builtin-id
          severity: error
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#string-format
        - name: string-format
          severity: warning
          arguments:
            - - 'log.Info[0]'
              - '/(^[^A-Z]|$)/'
              - must start with a capital letter
            - - 'fmt.Errorf[0]'
              - '/(^|[^\.!?])$/'
              - must not end in punctuation
            - - panic
              - '/^[^\n]*$/'
              - must not contain line breaks
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#string-of-int
        - name: string-of-int
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#struct-tag
        - name: struct-tag
          severity: warning
          arguments: ["json,inline", "validate,-,version,yaml,expr", "yaml,inline"]
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#superfluous-else
        - name: superfluous-else
          severity: warning
          arguments:
            - "preserveScope"
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#time-equal
        - name: time-equal
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#time-naming
        - name: time-naming
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unchecked-type-assertion
        - name: unchecked-type-assertion
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unconditional-recursion
        - name: unconditional-recursion
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unexported-naming
        - name: unexported-naming
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unexported-return
        - name: unexported-return
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unhandled-error
        - name: unhandled-error
          severity: warning
          arguments:
            - "fmt\\.Fprint(f|ln)?"
            - "fmt\\.Print(f|ln)?"
            - "strings\\.Builder\\.Write(.*)?"
            - "os\\.Remove(All)?"
            - "os\\.File\\.Close"
            - "bytes\\.Buffer\\.Write"
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unnecessary-stmt
        - name: unnecessary-stmt
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unreachable-code
        - name: unreachable-code
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#use-any
        - name: use-any
          severity: error
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#useless-break
        - name: useless-break
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#var-declaration
        - name: var-declaration
          severity: warning
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#var-naming
        - name: var-naming
          severity: warning
          arguments:
            # AllowList - Allow these to be ignored as initialisms.
            - []
            # DenyList - Force these to be treated as initialisms.
            - - API
              - HTTP
              - DON
              - YAML
              - JSON
              - TOML
              - INI
            - - skipPackageNameChecks: true
                upperCaseConst: true
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#waitgroup-by-value
        - name: waitgroup-by-value
          severity: warning

    # https://golangci-lint.run/usage/linters/#tagalign
    tagalign:
      align: true
      sort: true
      order:
        - default
        - json
        - yaml
        - yml
        - toml
        - mapstructure
        - copier
        - binding
        - validate

  exclusions:
    generated: lax
    warn-unused: false
    rules:
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
          - revive
      - path: build/devenv
        linters:
          - dupl
          - errcheck
          - forbidigo
          - gocyclo
          - gosec
          - revive
      - path: build/devenv
        linters:
          - staticcheck
        text: "testcontainers.BindMount is deprecated"
      - path: 'pkg/handlers/validations\.go'
        linters:
          - gci
          - goimports

# https://golangci-lint.run/usage/configuration/#formatters-configuration
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    # https://golangci-lint.run/usage/formatters/#gofmt
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
        - pattern: 'a[b:len(a)]'
          replacement: 'a[b:]'
    # https://golangci-lint.run/usage/formatters/#gofumpt
    gofumpt:
      module-path: github.com/smartcontractkit/chainlink-ccv
      extra-rules: true
    # https://golangci-lint.run/usage/formatters/#goimports
    goimports:
      local-prefixes:
        - github.com/smartcontractkit/chainlink-ccv
        - github.com/smartcontractkit

  exclusions:
    generated: lax
    warn-unused: false

# https://golangci-lint.run/usage/configuration/#issues-configuration
issues:
  max-issues-per-linter: 0 # disable limit - show all
  max-same-issues: 0 # disable limit - show all
  uniq-by-line: true
  new: false
  whole-files: true
  fix: false

# https://golangci-lint.run/usage/configuration/#output-configuration
output:
  formats:
    text:
      path: stderr
      colors: true
    json:
      path: .build/ci/golangci-lint-report.json
    html:
      path: .build/ci/golangci-lint-report.html
  path-prefix: .build/ci

# https://golangci-lint.run/usage/configuration/#run-configuration
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: true

# https://golangci-lint.run/usage/configuration/#severity-configuration
severity:
  default: error
  rules:
    - linters:
        - dupl
      severity: info
