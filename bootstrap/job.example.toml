# Example local job-spec file for local mode (BOOTSTRAPPER_MODE=local).
#
# Point BOOTSTRAPPER_JOB_SPEC_PATH at a copy of this file (default: /etc/bootstrap/job.toml).
# The outer fields mirror the job spec a Job Distributor would push; the app config lives in the
# `appConfig` block and is decoded by the service factory (here, the committee verifier's
# commit.Config). Replace the placeholder values below with your deployment's addresses.

schemaVersion = 1
type = "ccvcommitteeverifier"
name = "committee-verifier-local"
externalJobID = "00000000-0000-0000-0000-000000000001"

appConfig = '''
verifier_id = "my-committee-verifier"

# One or more aggregators this verifier writes results to.
[[aggregators]]
name = "primary"
address = "aggregator.example.com:50051"
insecure_connection = true

# Per-chain-selector addresses. All three maps must cover the same set of chain selectors.
[on_ramp_addresses]
"3379446385462418246" = "0x0000000000000000000000000000000000000000"

[committee_verifier_addresses]
"3379446385462418246" = "0x0000000000000000000000000000000000000000"

[rmn_remote_addresses]
"3379446385462418246" = "0x0000000000000000000000000000000000000000"
'''
