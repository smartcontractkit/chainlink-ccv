# Example local app-config file for local mode (BOOTSTRAPPER_MODE=local).
#
# Point BOOTSTRAPPER_LOCAL_CONFIG_PATH at a copy of this file (default: /etc/bootstrap/app.toml).
# This is the plain app config the service factory decodes — the same content JD would ship in a
# job's appConfig, with no job-spec envelope. The example below is a committee verifier config
# (commit.Config); replace the placeholder values with your deployment's addresses.

verifier_id = "my-committee-verifier"

# One or more aggregators this verifier writes results to.
[[aggregators]]
name = "primary"
address = "aggregator.example.com:50051"
insecure_connection = true

# Per-chain-selector addresses. All three maps must cover the same set of chain selectors.
[on_ramp_addresses]
"3379446385462418246" = "0x0000000000000000000000000000000000000000"

[committee_verifier_addresses]
"3379446385462418246" = "0x0000000000000000000000000000000000000000"

[rmn_remote_addresses]
"3379446385462418246" = "0x0000000000000000000000000000000000000000"
