# Code generated by tools/configdoc. DO NOT EDIT.
# Evm configuration reference. Values shown are defaults or illustrative examples.

# chains maps EVM chain selector (decimal string) to its operator-local settings.
[chains]
  [chains.1]
    # finality_depth is the number of blocks required before a head is considered final.
    # Zero enables finality-tag mode; a positive value uses confirmation-depth mode.
    finality_depth = 0
    # txm_block_time controls TXM v2's retry cadence: a transaction rebroadcasts once it is
    # RetryBlockThreshold times this value old, so it should track the chain's real block
    # interval. It is not used outside the transaction manager. Zero takes the chain's curated
    # default block interval when one exists and DefaultTXMBlockTime otherwise; upstream
    # validation rejects values below two seconds.
    txm_block_time = "2s"
    # source_reader_header_fetch_batch_size caps how many eth_getBlockByNumber requests
    # are sent in a single JSON-RPC batch when the source reader fetches block
    # headers. Zero uses [DefaultSourceReaderHeaderFetchBatchSize], which is 20.
    source_reader_header_fetch_batch_size = 0
    # log_poller_source_reader_enabled makes the committee verifier read this source chain through a LogPoller
    # instead of RPC. It requires [db] in the EVM secrets file. Defaults to false.
    log_poller_source_reader_enabled = true

    # nodes are the RPC endpoints used to reach this chain.
    [[chains.1.nodes]]
      # name identifies the RPC provider or endpoint in logs and health reports.
      name = "node-1"
      # http_url is the JSON-RPC endpoint used for reads and transaction submission. Send-only nodes
      # use it only for transaction submission. It is required.
      http_url = "http://rpc-url.com"
      # ws_url is the optional WebSocket endpoint used for head subscriptions on primary nodes. Primary
      # nodes without one fall back to HTTP head polling; send-only nodes ignore it.
      ws_url = "ws://rpc-url.com"
      # order is the primary node's selection priority, from 1 (highest) through 100 (lowest); zero
      # leaves it unset for chainlink-evm's default. Send-only nodes ignore it, matching Chainlink.
      order = 1

    # nodes are the RPC endpoints used to reach this chain.
    [[chains.1.nodes]]
      # name identifies the RPC provider or endpoint in logs and health reports.
      name = "send-only-1"
      # http_url is the JSON-RPC endpoint used for reads and transaction submission. Send-only nodes
      # use it only for transaction submission. It is required.
      http_url = "http://send-only-rpc-url.com"
      # send_only restricts the node to transaction broadcasts over HTTP. It defaults to false, and at
      # least one primary (non-send-only) node is required per chain.
      send_only = true
      # order is the primary node's selection priority, from 1 (highest) through 100 (lowest); zero
      # leaves it unset for chainlink-evm's default. Send-only nodes ignore it, matching Chainlink.
      order = 100

