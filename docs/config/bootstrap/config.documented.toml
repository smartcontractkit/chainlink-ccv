# Code generated by tools/configdoc. DO NOT EDIT.
# Bootstrap configuration reference. Values shown are defaults or illustrative examples.

# app_config_mode selects how the bootstrapper loads application config: "jd_app_config" (default
# when empty, for backward compatibility) or "local_app_config". See AppConfigMode.
app_config_mode = "jd_app_config"

# local_app_config_path is the path to the application config file read in local mode. Required when
# AppConfigMode is "local_app_config"; ignored otherwise. Distinct from the bootstrap config path
# (BOOTSTRAPPER_CONFIG_PATH): this file holds the app's own config, not the operator/infra config.
local_app_config_path = "/etc/committee-verifier/app.toml"

[jd]
  # server_wsrpc_url is the URL of the Job Distributor server's WebSocket RPC endpoint.
  server_wsrpc_url = "ws://job-distributor:8080/ws"
  # server_csa_public_key is the public key of the Job Distributor server's CSA key.
  server_csa_public_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

[server]
  # listen_port is the port the HTTP server listens on.
  listen_port = 9988

# chains declares the chains on which this node has a signing identity.
# Each entry causes the bootstrapper to register the node's signing key for that chain in JD.
# Optional: if empty, no signing key sync is performed.
[[chains]]
  # type is the chain family, e.g. "EVM", "SOLANA". Case-insensitive.
  type = "EVM"
  # id is the chain identifier, e.g. "1" for Ethereum mainnet.
  id = "1"

# key_import adopts a Chainlink node key into the keystore on first boot instead of generating
# one. Optional: when absent every declared key is generated, which is right for a new
# deployment. It is set when migrating an operator off CL mode. When the section is present,
# expected_id is required.
[key_import]
  # path is the mounted path of the key file exported from the Chainlink node.
  path = "/etc/ccv/migration/key.json"
  # password_path is the mounted path of a file holding the password used at export time.
  password_path = "/etc/ccv/migration/export-password.txt"
  # expected_id pins the address the export must carry. It is required because it is the check
  # that fails the boot when the wrong node's export is mounted — without it the process comes
  # up signing as somebody else, which the committee rejects with nothing pointing at the cause.
  expected_id = "0x0123456789abcdef0123456789abcdef01234567"

# Monitoring is the operator-provided monitoring configuration.
# These are operator- and environment-specific (the OTel exporter endpoints point
# at a collector deployed alongside the app, typically a k8s sidecar), so they belong in the
# operator-provided bootstrap config rather than the JD-shipped app config.
# It is a pointer to distinguish "operator did not configure monitoring here" (nil) from "operator
# explicitly configured it, possibly with Enabled=false" (non-nil). The apps that consume it (commit
# verifier, executor) prefer this value and fall back to their deprecated app-config Monitoring field
# only when it is nil. The token verifier is the exception: it loads no bootstrap config and keeps
# monitoring in its (already operator-provided) mounted app config.
[Monitoring]
  # LogLevel specifies the logging level for service logger
  LogLevel = "info"
  # Pyroscope is the configuration for pyroscope performance monitoring tool
  [Monitoring.Pyroscope]
    # Enabled enables the pyroscope telemetry.
    Enabled = false
    # URL specifies the remote endpoint of pyroscope service
    URL = "http://pyroscope:4040"
  # Beholder is the configuration for the beholder client.
  [Monitoring.Beholder]
    # Enabled enables the beholder telemetry.
    Enabled = false
    # InsecureConnection disables TLS for the beholder client.
    InsecureConnection = true
    # CACertFile is the path to the CA certificate file for the beholder client.
    CACertFile = "/etc/ssl/certs/otel-collector.pem"
    # OtelExporterGRPCEndpoint is the endpoint for the beholder client to export to the collector.
    OtelExporterGRPCEndpoint = "otel-collector:4317"
    # OtelExporterHTTPEndpoint is the endpoint for the beholder client to export to the collector.
    OtelExporterHTTPEndpoint = "otel-collector:4318"
    # LogStreamingEnabled enables log streaming to the collector.
    LogStreamingEnabled = false
    # LogStreamingLevel specifies the level above which logs are streamed to beholder
    LogStreamingLevel = "info"
    # MetricReaderInterval is the interval to scrape metrics (in seconds).
    MetricReaderInterval = 60
    # TraceSampleRatio is the ratio of traces to sample.
    TraceSampleRatio = 0.1
    # TraceBatchTimeout is the timeout for a batch of traces.
    TraceBatchTimeout = 5
    # TelemetryAttributes are additional labels that assigned during OTel transmission
    [Monitoring.Beholder.TelemetryAttributes]
      env = "production"

