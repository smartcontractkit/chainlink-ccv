    # ed25519_key_id is the KMS Key ID for Ed25519 keys (e.g. the CSA key for JD auth).
    ed25519_key_id = "arn:aws:kms:us-east-1:...:key/def456-..."

[db]
  # url is the URL to use for saving jobs and the keystore.
  url = "postgres://user:password@localhost:5432/bootstrapper?sslmode=disable"

