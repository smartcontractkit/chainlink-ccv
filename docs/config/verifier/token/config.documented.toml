# Code generated by tools/configdoc. DO NOT EDIT.
# Token verifier configuration reference. Values shown are defaults or illustrative examples.

# pyroscope_url is the Pyroscope server URL for continuous profiling; empty disables it.
pyroscope_url = ""

# token_verifiers is a list of token verifier configurations. Each entry defines a token verifier instance with its own type, version and configuration.
[[token_verifiers]]
  # verifier_id is the unique identifier for this token verifier instance.
  # This allows multiple token verifiers to run on the same node with isolated state.
  verifier_id = "token-verifier-1"
  # type is the type of the token verifier. You can think of different token verifiers as different
  # strategies for processing token data. For example, you can have a token verifiers for USDC tokens using CCTP
  # and different one for processing LINK token.
  type = "cctp"
  # version is the version of the token.VerifierConfig and the matching verifier.Verifier implementation for that config.
  # This is used to determine which version of the verifier to use. Right now, we only have one version
  # of the verifier, but in the future, we might have multiple versions.
  # This is a precautionary measure to ensure that we can upgrade the verifier without breaking the existing ones.
  # Example would be CCTPv1 using AttestationAPI and CCTPv2 using a different API or completely
  # different strategy which requires different configuration and implementation during Verification phase.
  # Example JSON representation (but any format would work, as long proper marshall/unmarshall is implemented):
  # [
  # {
  # "type": "cctp",
  # "version": "2.0",
  # "attestationAPI": "http://circle.com/attestation",
  # "attestationAPITimeout": "1s",
  # "attestationAPIIntervalMilliseconds": "500ms"
  # },
  # {
  # "type": "lombard",
  # "version": "1.0",
  # "attestationAPI": "http://lombard.com/gohere",
  # "attestationAPITimeout": "1s",
  # "attestationAPIIntervalMilliseconds": "500ms"
  # }
  # ]
  # Having version in that JSON isn't expensive, but it could reduce the risk of breaking the observers in the future.
  version = "2.0"

# monitoring contains the monitoring configuration for the token verifier, including Beholder settings.
# Unlike the commit (committee) verifier and the executor — which now source monitoring from the
# operator-provided bootstrap config (bootstrap.Config.Monitoring) rather than their JD-shipped app
# config — the token verifier intentionally keeps monitoring here, in its app config. It runs in
# local app-config mode (app_config_mode = "local_app_config") with no JD/DB/keystore; its app
# config file is already operator-provided (mounted, not JD-shipped), so this field already
# satisfies the rule that monitoring must be operator-provided and never delivered via a JD-shipped
# app config.
[monitoring]
  # LogLevel specifies the logging level for service logger
  LogLevel = ""
  # Pyroscope is the configuration for pyroscope performance monitoring tool
  [monitoring.Pyroscope]
    # Enabled enables the pyroscope telemetry.
    Enabled = false
    # URL specifies the remote endpoint of pyroscope service
    URL = ""
  # Beholder is the configuration for the beholder client.
  [monitoring.Beholder]
    # Enabled enables the beholder telemetry.
    Enabled = false
    # InsecureConnection disables TLS for the beholder client.
    InsecureConnection = false
    # CACertFile is the path to the CA certificate file for the beholder client.
    CACertFile = ""
    # OtelExporterGRPCEndpoint is the endpoint for the beholder client to export to the collector.
    OtelExporterGRPCEndpoint = ""
    # OtelExporterHTTPEndpoint is the endpoint for the beholder client to export to the collector.
    OtelExporterHTTPEndpoint = ""
    # LogStreamingEnabled enables log streaming to the collector.
    LogStreamingEnabled = false
    # LogStreamingLevel specifies the level above which logs are streamed to beholder
    LogStreamingLevel = ""
    # MetricReaderInterval is the interval to scrape metrics (in seconds).
    MetricReaderInterval = 0
    # TraceSampleRatio is the ratio of traces to sample.
    TraceSampleRatio = 0.0
    # TraceBatchTimeout is the timeout for a batch of traces.
    TraceBatchTimeout = 0

# on_ramp_addresses is a map the addresses of the on ramps for each chain selector.
[on_ramp_addresses]
  1 = "0x00000000000000000000000000000000000000a1"

# rmn_remote_addresses is a map of RMN Remote contract addresses for each chain selector.
# Required for curse detection.
[rmn_remote_addresses]
  1 = "0x00000000000000000000000000000000000000b1"

