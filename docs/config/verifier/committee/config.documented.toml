  # Beholder is the configuration for the beholder client.
  [monitoring.Beholder]
    # Enabled enables the beholder telemetry.
    Enabled = false
    # InsecureConnection disables TLS for the beholder client.
    InsecureConnection = false
    # CACertFile is the path to the CA certificate file for the beholder client.
    CACertFile = ""
    # OtelExporterGRPCEndpoint is the endpoint for the beholder client to export to the collector.
    OtelExporterGRPCEndpoint = ""
    # OtelExporterHTTPEndpoint is the endpoint for the beholder client to export to the collector.
    OtelExporterHTTPEndpoint = ""
    # LogStreamingEnabled enables log streaming to the collector.
    LogStreamingEnabled = false
    # LogStreamingLevel specifies the level above which logs are streamed to beholder
    LogStreamingLevel = ""
    # MetricReaderInterval is the interval to scrape metrics (in seconds).
    MetricReaderInterval = 0
    # TraceSampleRatio is the ratio of traces to sample.
    TraceSampleRatio = 0.0
    # TraceBatchTimeout is the timeout for a batch of traces.
    TraceBatchTimeout = 0

# on_ramp_addresses is a map the addresses of the on ramps for each chain selector.
[on_ramp_addresses]
  1 = "0x00000000000000000000000000000000000000a1"

# rmn_remote_addresses is a map of RMN Remote contract addresses for each chain selector.
# DEPRECATED: the RMN Remote address is derived from each OnRamp's on-chain static config,
# which is authoritative. This field is retained so that job specs written before the
# derivation cutover still decode; when an entry is present and disagrees with the derived
# address, a warning is logged and the derived address is used. Remove once deployed specs
# no longer carry it.
[rmn_remote_addresses]
  1 = "0x00000000000000000000000000000000000000b1"

