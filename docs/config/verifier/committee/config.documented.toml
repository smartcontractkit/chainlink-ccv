# Committee verifier configuration reference. Values shown are defaults or illustrative examples.

# verifier_id is the unique identifier for this committee verifier instance.
verifier_id = "committee-verifier-1"

# aggregator_address configures a single aggregator. DEPRECATED in favor of Aggregators;
# retained for backwards compatibility. It is mutually exclusive with Aggregators: setting
# both is a configuration error. When Aggregators is empty, this address (together with the
# legacy InsecureAggregatorConnection and AggregatorMax*MsgSizeBytes fields) is used to
# synthesize a single-aggregator connection.
aggregator_address = ""

# insecure_aggregator_connection disables TLS for the aggregator gRPC connection.
# DEPRECATED: only applies to the legacy AggregatorAddress path; use
# AggregatorConnection.InsecureConnection with Aggregators instead.
# Only use this for testing when custom certificates cannot be injected.
insecure_aggregator_connection = false

# aggregator_max_send_msg_size_bytes is the maximum gRPC message size for sending requests to the aggregator.
# The batch-splitting logic uses this value to ensure outgoing batches don't exceed this limit.
# Should match or be less than the aggregator's server maxRecvMsgSizeBytes setting.
# If 0 or not set, defaults to 4MB.
# DEPRECATED: only applies to the legacy AggregatorAddress path.
aggregator_max_send_msg_size_bytes = 0

# aggregator_max_recv_msg_size_bytes is the maximum gRPC message size for receiving responses from the aggregator.
# Should match or be less than the aggregator's server maxSendMsgSizeBytes setting.
# If 0 or not set, defaults to 4MB.
# DEPRECATED: only applies to the legacy AggregatorAddress path.
aggregator_max_recv_msg_size_bytes = 0

# message_disablement_rules_poll_interval and MessageDisablementRulesClientTimeout are Go duration strings
# (e.g. "2s", "500ms"). Empty means use the integration package default for that setting.
# They are stored as strings (not time.Duration) because the Chainlink node unmarshals
# committeeVerifierConfig with github.com/pelletier/go-toml, which does not decode TOML
# duration strings into time.Duration. Standalone / devenv decoding uses github.com/BurntSushi/toml,
# which does support time.Duration; using string keeps both paths and changeset marshaling compatible.
message_disablement_rules_poll_interval = "2s"

# message_disablement_rules_client_timeout is the RPC timeout for message-disablement-rules requests, as a Go duration string; empty uses the integration default.
message_disablement_rules_client_timeout = "500ms"

# message_disablement_rules_disabled when true, disables message-disablement rules entirely:
# the verifier does not poll aggregators for disablement rules and treats no message as
# disabled (equivalent to an AllowAllMessagesChecker). This opts out of the fail-safe
# union, so an unreachable aggregator at startup no longer blocks attestation — at the cost
# of silently ignoring kill-switch rules set on any aggregator. It defaults to false (rules
# enabled, the safe option) and should only be set true as a deliberate opt-in.
message_disablement_rules_disabled = false

# signer_address is the on-chain address of the verifier's result-signing key.
signer_address = "0x00000000000000000000000000000000000000d1"

# pyroscope_url is the Pyroscope server URL for continuous profiling; empty disables it.
pyroscope_url = ""

# http_listen_port is the port the standalone verifier's HTTP server (/health, /stats) listens
# on. Defaults to 8100. Inert in CL mode, which serves its own API.
# Omitted from marshaled job specs when unset so CL-mode specs are unchanged.
http_listen_port = 8100

# disable_finality_checkers is a list of chain selectors for which the finality violation checker should be disabled.
# The chain selectors are formatted as strings of the chain selector.
# Only standalone mode honors this list; CL mode ignores it and always runs finality checkers.
# EVM standalone jobs must not set it: CL mode is the production reference and never disables
# checking. The field remains for chain families with existing standalone deployments that rely on it.
disable_finality_checkers = []

# aggregators is the list of aggregators a consolidated verifier job writes to. When
# non-empty it is authoritative and the legacy AggregatorAddress field must be empty.
[[aggregators]]
  # name is an optional human-readable label used in logs and metric labels.
  # When empty it defaults to Address.
  name = "aggregator-1"
  # secret_name is the credential lookup key for this aggregator — the one join key used in both
  # deployment modes to resolve the aggregator's HMAC credential (kept distinct from Name so the
  # display label can change without re-wiring secrets):
  # - standalone: the env var pair VERIFIER_AGGREGATOR_<SECRETNAME>_API_KEY / _SECRET_KEY;
  # - Chainlink node: the secrets.toml entry whose VerifierID equals this value, which also
  # becomes the key in the per-aggregator credential map passed to the coordinator.
  # Empty (the legacy single-aggregator path) falls back to the default un-suffixed credential
  # variables. Secrets themselves never live in config — only this reference does.
  secret_name = "aggregator_1"
  # address is the aggregator gRPC endpoint (host:port). Required.
  address = "aggregator-1:50051"
  # insecure_connection disables TLS for this aggregator's gRPC connection.
  # Only use this for testing when custom certificates cannot be injected.
  insecure_connection = false
  # max_send_msg_size_bytes is the maximum gRPC message size for sending requests to this
  # aggregator. The batch-splitting logic uses this to keep outgoing batches under the
  # limit. If 0 or not set, defaults to 4MB.
  max_send_msg_size_bytes = 4194304
  # max_recv_msg_size_bytes is the maximum gRPC message size for receiving responses from
  # this aggregator. If 0 or not set, defaults to 4MB.
  max_recv_msg_size_bytes = 4194304

# committee_verifier_addresses is a map the addresses of the committee verifiers for each chain selector.
[committee_verifier_addresses]
  1 = "0x00000000000000000000000000000000000000c1"

# default_executor_on_ramp_addresses is a map the addresses of the default executor on ramps for each chain selector.
# The committee verifier will verify messages that specify the default executor even if they don't
# specify the committee verifier.
[default_executor_on_ramp_addresses]
  1 = "0x00000000000000000000000000000000000000e1"

