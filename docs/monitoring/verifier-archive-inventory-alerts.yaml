apiVersion: 1
groups:
  - orgId: 1
    name: ccv-verifier-archive-inventory
    folder: CCV
    interval: 1m
    rules:
      - uid: ccv-archive-expiry
        title: CCV failed archive retention warning
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CCV failed archive retention warning
          description: Retained failed jobs are within seven days of the 30-day archive cutoff. Inspect candidates and canonicality before rescheduling.
          runbook_url: https://github.com/smartcontractkit/chainlink-ccv/blob/main/docs/runbooks/remediating-stuck-or-dropped-messages.md
        labels:
          severity: warning
          component: verifier
        data:
          - refId: A
            datasourceUid: victoriametrics
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              refId: A
              instant: true
              range: false
              expr: >-
                verifier_archive_expiring_jobs > 0
                and on (node_id, verifier_id, queue) (verifier_archive_collection_success == 1)
                and on (node_id, verifier_id, queue) (time() - verifier_archive_last_success_timestamp <= 180)
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
              type: math
              expression: $A > 0
      - uid: ccv-archive-collection
        title: CCV archive inventory collection unhealthy
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CCV archive inventory collection unhealthy
          description: Archive inventory collection failed, is over three minutes stale, or is entirely absent. Last good inventory may still be displayed; inspect database and telemetry health.
          runbook_url: https://github.com/smartcontractkit/chainlink-ccv/blob/main/docs/runbooks/remediating-stuck-or-dropped-messages.md
        labels:
          severity: warning
          component: verifier
        data:
          - refId: A
            datasourceUid: victoriametrics
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              refId: A
              instant: true
              range: false
              expr: >-
                (verifier_archive_collection_success == 0) + 1
                or (time() - max_over_time(verifier_archive_last_success_timestamp[15m]) > 180)
                or absent(verifier_archive_collection_success)
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
              type: math
              expression: $A > 0