apiVersion: 1
groups:
  - orgId: 1
    name: ccv-verifier-source-recovery
    folder: CCV
    interval: 1m
    rules:
      - uid: ccv-recovery-audit
        title: CCV recovery audit write failed
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CCV recovery audit write failed
          description: Recovery history has gaps due to failed evidence writes. Finality blocking remains enforced. Query coverage and investigate source data for missing evidence.
          runbook_url: https://github.com/smartcontractkit/chainlink-ccv/blob/main/docs/runbooks/remediating-stuck-or-dropped-messages.md
        labels:
          severity: warning
          component: verifier
        data:
          - refId: A
            datasourceUid: victoriametrics
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              refId: A
              instant: true
              range: false
              expr: >-
                increase(verifier_recovery_audit_failures_total[15m]) > 0
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
              type: math
              expression: $A > 0
